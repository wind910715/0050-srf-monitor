name: Touch Event TG Notify

# 由本機 unitrade 觸價監控 dispatch（touch_event.json 已推上 main 後觸發）。
# 只讀事件檔、用 Secrets 推 TG，不改 state、不跑引擎。
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Send TG from touch_event.json
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          pip install -q requests
          python3 - << 'EOF'
          import json, os, sys
          import requests
          try:
              with open("touch_event.json", encoding="utf-8") as f:
                  ev = json.load(f)
          except Exception as e:
              print(f"no touch_event.json ({e}), skip")
              sys.exit(0)
          msg = ev.get("message")
          if not msg:
              print("empty message, skip")
              sys.exit(0)
          r = requests.post(
              f"https://api.telegram.org/bot{os.environ['TG_BOT_TOKEN']}/sendMessage",
              json={"chat_id": os.environ["TG_CHAT_ID"], "text": msg, "parse_mode": "HTML"},
              timeout=30)
          print("TG status:", r.status_code)
          if r.status_code == 200:
              print("[TG_PUSH_OK]")
          else:
              print("TG failed:", r.text[:200])
              sys.exit(1)
          EOF

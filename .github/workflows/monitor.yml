name: 0050 & TSMC Futures 35s High-Freq Monitor

on:
  schedule:
    # 台灣時間 每日 08:00 (UTC 00:00) 與 17:30 (UTC 09:30) 強制發送日盤/夜盤完整戰情早晚報
    - cron: '0 0 * * 1-5'
    - cron: '30 9 * * 1-5'
    # 台灣時間 日盤與夜盤交易時段：每 5 分鐘啟動一次容器，容器內每 35 秒自動迴圈運算 8 次
    - cron: '*/5 0-5 * * 1-5'
    - cron: '*/5 9-21 * * 1-5'
  workflow_dispatch: # 支援手動一鍵觸發測試

concurrency:
  group: srf-qff-high-freq-monitor
  cancel-in-progress: false

jobs:
  high_freq_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run 35-Second High-Frequency Strategy Loop
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          POLL_INTERVAL_SEC: '35'
          MAX_ITERATIONS: '8'
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 1-5' || github.event.schedule == '30 9 * * 1-5' }}
        run: python monitor_srf.py

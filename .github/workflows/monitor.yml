name: 0050 & TSMC Futures Pro-Max Monitor

on:
  schedule:
    # 台灣時間 每日 08:15 (早盤提早30分鐘開機待命) 與 14:30 (夜盤提早30分鐘開機待命)
    - cron: '15 0 * * 1-5'
    - cron: '30 6 * * 1-5'
    # 台灣時間 早盤時段 (08:00 ~ 13:55，涵蓋 08:15 待命與 08:45-13:45 實時監控)
    - cron: '*/5 0-5 * * 1-5'
    # 台灣時間 夜盤時段 (14:00 ~ 次日 05:05，涵蓋 14:30 待命與 15:00-05:00 實時監控)
    - cron: '*/5 6-21 * * 1-5'
    # 每週六早上 09:00 (台灣時間) 自動執行策略回測報告
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      run_backtest:
        description: '是否同時執行【每週六回測勝率報告】？(輸入 true 或 false)'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# 關鍵修正：設為 true，當您手動點擊 Run workflow 時，立即中斷舊迴圈、1秒內優先插隊執行！
concurrency:
  group: srf-qff-high-freq-monitor
  cancel-in-progress: true

jobs:
  high_freq_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz

      - name: Run Weekly Backtest (Every Saturday 09:00 TW or Manual Trigger)
        if: github.event.schedule == '0 1 * * 6' || github.event.inputs.run_backtest == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python weekly_backtest.py

      - name: Run 30-Second Realtime Strategy Engine
        if: github.event.schedule != '0 1 * * 6'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          POLL_INTERVAL_SEC: '30'
          # 手動觸發時立刻掃描並推播，不卡迴圈；排程觸發時每 30 秒掃描一次共 8 輪
          MAX_ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && '1' || '8' }}
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 0 * * 1-5' || github.event.schedule == '30 6 * * 1-5' }}
        run: python monitor_srf.py

      - name: Persist Position & Signal State
        if: github.event.schedule != '0 1 * * 6'
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update bot state [skip ci]"
              git pull --rebase origin ${{ github.ref_name }} || true
              git push origin ${{ github.ref_name }} || true
            fi
          fi

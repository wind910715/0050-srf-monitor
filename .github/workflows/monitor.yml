name: 0050 & TSMC Futures Pro-Max Monitor

on:
  schedule:
    # 台灣時間 週一至週五 全天候每 5 分鐘啟動一次 (內部自動判斷 08:10 早盤備戰、14:00 收盤損益結算報表、14:26 夜盤備戰，徹底消除排程衝突！)
    - cron: '*/5 0-21 * * 1-5'
    # 每週六早上 09:00 (台灣時間，對應 UTC 週六 01:00) 自動執行策略回測報告
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      run_backtest:
        description: '是否同時執行【每週六回測勝率報告】？(輸入 true 或 false)'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: srf-qff-high-freq-monitor
  cancel-in-progress: true

jobs:
  high_freq_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz

      - name: Run Weekly Backtest (Every Saturday 09:00 TW or Manual Trigger)
        if: github.event.schedule == '0 1 * * 6' || github.event.inputs.run_backtest == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python weekly_backtest.py

      - name: Run 30-Second Realtime Strategy Engine
        if: github.event.schedule != '0 1 * * 6'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          POLL_INTERVAL_SEC: '30'
          MAX_ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && '1' || '8' }}
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' }}
        run: python monitor_srf.py

      - name: Persist Position & Account State
        if: github.event.schedule != '0 1 * * 6'
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update bot account & position state [skip ci]"
              git pull --rebase origin ${{ github.ref_name }} || true
              git push origin ${{ github.ref_name }} || true
            fi
          fi

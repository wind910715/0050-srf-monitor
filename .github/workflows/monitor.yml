name: 0050 & TSMC Futures Pro-Max Monitor

on:
  schedule:
    # 台灣時間 每日 08:00 (UTC 00:00) 與 17:30 (UTC 09:30) 強制發送日盤/夜盤完整戰情早晚報
    - cron: '0 0 * * 1-5'
    - cron: '30 9 * * 1-5'
    # 台灣時間 日盤與夜盤交易時段：每 5 分鐘啟動一次容器，容器內每 35 秒自動迴圈運算 8 次
    - cron: '*/5 0-5 * * 1-5'
    - cron: '*/5 9-21 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 賦予自動保存 state.json (跨容器防洗版與虛擬持倉記憶) 的讀寫權限
permissions:
  contents: write

concurrency:
  group: srf-qff-high-freq-monitor
  cancel-in-progress: false

jobs:
  high_freq_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies Directly
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz

      - name: Run 35-Second Pro-Max Strategy Engine
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          POLL_INTERVAL_SEC: '35'
          MAX_ITERATIONS: '8'
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 1-5' || github.event.schedule == '30 9 * * 1-5' }}
        run: python monitor_srf.py

      - name: Persist Position & Signal State Across Containers
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update bot position & signal state [skip ci]"
              git pull --rebase origin ${{ github.ref_name }} || true
              git push origin ${{ github.ref_name }} || true
            fi
          fi
